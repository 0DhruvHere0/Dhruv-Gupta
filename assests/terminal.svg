<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 650">

    <!-- Background -->
    <rect
        width="1000"
        height="650"
        rx="16"
        fill="#0d1117"/>

    <!-- Title Bar -->
    <rect
        width="1000"
        height="50"
        rx="16"
        fill="#161b22"/>

    <!-- Fix square bottom corners -->
    <rect
        y="25"
        width="1000"
        height="25"
        fill="#161b22"/>

    <!-- macOS buttons -->
    <circle cx="28" cy="25" r="7" fill="#ff5f56"/>
    <circle cx="52" cy="25" r="7" fill="#ffbd2e"/>
    <circle cx="76" cy="25" r="7" fill="#27c93f"/>

    <!-- Window title -->
    <text
        x="500"
        y="31"
        fill="#c9d1d9"
        font-size="17"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        text-anchor="middle">

        Terminal

    </text>

</svg>