<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 650">

    <!-- Background -->
    <rect
        width="1000"
        height="650"
        rx="16"
        fill="#0d1117"/>

    <!-- Title Bar -->
    <rect
        width="1000"
        height="50"
        rx="16"
        fill="#161b22"/>

    <!-- Fill bottom of title bar -->
    <rect
        x="0"
        y="25"
        width="1000"
        height="25"
        fill="#161b22"/>

    <!-- macOS Window Buttons -->
    <circle cx="28" cy="25" r="7" fill="#ff5f56"/>
    <circle cx="52" cy="25" r="7" fill="#ffbd2e"/>
    <circle cx="76" cy="25" r="7" fill="#27c93f"/>

    <!-- Window Title -->
    <text
        x="500"
        y="31"
        fill="#c9d1d9"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="17"
        text-anchor="middle">
        Terminal
    </text>

    <!-- Last Login -->
    <text
        x="30"
        y="85"
        fill="#8b949e"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="18">
        Last login: Fri Aug 07 12:34:56 on ttys000
    </text>

    <!-- Prompt -->
    <text
        x="30"
        y="125"
        fill="#58a6ff"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="22">
        dhruv@github
    </text>

    <text
        x="195"
        y="125"
        fill="#c9d1d9"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="22">
        ~
    </text>

    <text
        x="220"
        y="125"
        fill="#c9d1d9"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="22">
        %
    </text>

    <text
        x="250"
        y="125"
        fill="#79c0ff"
        font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="22">
        neofetch
    </text>

</svg>