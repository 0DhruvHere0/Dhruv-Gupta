<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="650"
    viewBox="0 0 1000 650">

    <!-- Background -->
    <rect
        width="1000"
        height="650"
        rx="18"
        fill="#0d1117"/>

    <!-- Title Bar -->
    <rect
        width="1000"
        height="48"
        rx="18"
        fill="#161b22"/>

    <!-- Mac Buttons -->
    <circle cx="30" cy="24" r="8" fill="#ff5f56"/>
    <circle cx="55" cy="24" r="8" fill="#ffbd2e"/>
    <circle cx="80" cy="24" r="8" fill="#27c93f"/>

    <!-- Title -->
    <text
        x="500"
        y="30"
        fill="#c9d1d9"
        font-size="18"
        font-family="monospace"
        text-anchor="middle">
        Terminal
    </text>

    <!-- Login -->
    <text
        x="30"
        y="90"
        fill="#8b949e"
        font-family="monospace"
        font-size="20">
        Last login: Fri Aug 07 on github
    </text>

    <!-- Prompt -->
    <text
        x="30"
        y="130"
        fill="#58a6ff"
        font-family="monospace"
        font-size="24">
        dhruv@github
    </text>

    <text
        x="220"
        y="130"
        fill="#c9d1d9"
        font-family="monospace"
        font-size="24">
        ~
    </text>

    <text
        x="250"
        y="130"
        fill="#c9d1d9"
        font-family="monospace"
        font-size="24">
        %
    </text>

    <text
        x="280"
        y="130"
        fill="#79c0ff"
        font-family="monospace"
        font-size="24">
        neofetch
    </text>

</svg>